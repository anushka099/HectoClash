<!DOCTYPE html>
<html>
<head>
    <title>Game Room</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.4.1/socket.io.js"></script>
</head>
<body>
    <h1>Welcome to Room {{ ROOM }}</h1>
    
    <div id="numbers-container" style="display: none;">
        <h2>MAKE 100!!</h2>
        <p id="numbers"></p>
    </div>
    
    <form method="POST">
      <input type="text" name="solution" placeholder="Enter your solution...">
      <button type="submit">Submit</button>
  </form>
    <script>
        var socket = io();
        
        socket.on("show_numbers", function(numbers) {
            console.log("Received numbers:", numbers);
            document.getElementById("numbers").innerText = numbers.join(" ");
            document.getElementById("numbers-container").style.display = "block";
        });

        socket.on("connect", function() {
            console.log("Connected to the WebSocket server.");
        });

        socket.on("disconnect", function() {
            console.log("Disconnected from the WebSocket server.");
        });
    </script>
</body>
</html>
